name: Build CRIU .deb on Ubuntu (NV GPU support) + Release

on:
  push:
    branches: [ main, master, criu-dev ]
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Checkout your fork
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Enable deb-src & base tools
        run: |
          sudo sed -i 's/^# deb-src/deb-src/' /etc/apt/sources.list
          sudo apt-get update
          sudo apt-get install -y devscripts build-essential fakeroot dpkg-dev equivs

      - name: Fetch Ubuntu’s packaging (debian/ from Ubuntu source)
        run: |
          apt-get source -y criu
          UBUDIR="$(ls -d criu-*/ | head -n1)"
          rm -rf ./debian
          cp -a "${UBUDIR}/debian" ./debian

      - name: Install Ubuntu build-deps
        run: |
          sudo apt-get update
          # Ubuntu’s view of CRIU build-deps (keeps us aligned with Ubuntu rules)
          sudo apt-get build-dep -y criu
          # Optional: include AMD GPU plugin support too (not required for NV)
          sudo apt-get install -y libdrm-dev || true
          # Speed up builds if supported by rules
          echo "DEB_BUILD_OPTIONS=nodoc nocheck" >> $GITHUB_ENV

      - name: Build .deb with dpkg-buildpackage
        run: |
          SRC="$(dpkg-parsechangelog -S Source || true)"
          VER="$(dpkg-parsechangelog -S Version || true)"
          echo "Building ${SRC:-criu} ${VER}"
          dpkg-buildpackage -b -us -uc
          ls -lah ../*.deb ../*.buildinfo ../*.changes

      - name: Verify NV GPU support (fail if --gpu missing)
        run: |
          # Unpack the just-built binary to inspect it
          DEB="$(ls ../*.deb | head -n1)"
          mkdir -p _inspect && dpkg-deb -x "$DEB" _inspect
          if ! _inspect/usr/sbin/criu --help | grep -q -- '--gpu'; then
            echo "ERROR: Built criu does not advertise --gpu. NV GPU support not present."
            exit 1
          fi
          echo "OK: criu --help contains --gpu (NV GPU path present)."

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-debs
          path: |
            ../*.deb
            ../*.buildinfo
            ../*.changes

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: ubuntu-debs
          path: .

      - name: Decide release metadata
        id: meta
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            NAME="CRIU ${TAG} (Ubuntu build, NV GPU support)"
            PRERELEASE="false"
          else
            DATE="$(date -u +'%Y%m%d-%H%M%SZ')"
            SHORT_SHA="${GITHUB_SHA::7}"
            TAG="ubuntu-nightly-${DATE}-${SHORT_SHA}"
            NAME="Ubuntu nightly ${DATE} (${SHORT_SHA}) — NV GPU support"
            PRERELEASE="true"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "name=${NAME}" >> $GITHUB_OUTPUT
          echo "prerelease=${PRERELEASE}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release and upload .deb
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          generate_release_notes: true
          files: |
            *.deb
            *.buildinfo
            *.changes
