name: CRIU build (official guide) + .deb release

on:
  push:
    branches: [ main, master, criu-dev ]
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      DEBIAN_FRONTEND: noninteractive
      TZ: Etc/UTC
    steps:
      - name: Checkout your fork (sources per guide §2)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies (guide §3)
        run: |
          sudo apt-get update
          # Protocol Buffers + other deps (guide §3.2/§3.3)
          sudo apt-get install -y \
            build-essential pkg-config \
            protobuf-compiler libprotobuf-dev \
            protobuf-c-compiler libprotobuf-c-dev python3-protobuf \
            libnl-3-dev libnl-route-3-dev \
            libcap-dev libbsd-dev libmnl-dev libaio-dev \
            libnet1-dev libgnutls28-dev \
            iproute2 asciidoc xmlto \
            uuid-dev libdrm-dev
          # Optional AMD plugin support noted by the guide
          sudo apt-get install -y libdrm-dev || true

      - name: Build (guide §4 “Simply run make”)
        run: |
          make -j"$(nproc)"

      - name: Stage install (guide §5) into DESTDIR for packaging
        run: |
          TRIPLET="$(dpkg-architecture -qDEB_HOST_MULTIARCH)"
          mkdir -p pkgroot
          make DESTDIR="$PWD/pkgroot" install PREFIX=/usr LIBDIR=/usr/lib/$TRIPLET
          # Show staged tree
          find pkgroot -maxdepth 3 | sort

      - name: Verify NV GPU flag is present (runtime feature toggle)
        run: |
          # Verify CUDA plugin got installed
          if [ -f pkgroot/var/lib/criu/cuda_plugin.so ]; then
            echo "OK: Found CUDA plugin at /var/lib/criu/cuda_plugin.so"
          elif ls pkgroot/usr/lib*/criu/cuda_plugin.so >/dev/null 2>&1; then
            echo "OK: Found CUDA plugin under \$libdir/criu"
          else
            echo "ERROR: cuda_plugin.so not installed; CUDA plugin missing."
            exit 1
          fi

          # (Optional) verify AMDGPU plugin too
          if [ -f pkgroot/var/lib/criu/amdgpu_plugin.so ] || ls pkgroot/usr/lib*/criu/amdgpu_plugin.so >/dev/null 2>&1; then
            echo "OK: Found AMDGPU plugin."
          else
            echo "NOTE: AMDGPU plugin not found (install libdrm-dev before build if you need it)."
          fi

      - name: Build .deb (minimal packaging around official install)
        run: |
          ARCH="$(dpkg --print-architecture)"
          VER="$(git describe --tags --always --dirty || echo 0.0)"
          mkdir -p pkgroot/DEBIAN
          cat > pkgroot/DEBIAN/control <<EOF
          Package: criu
          Version: 0.0~git${VER}
          Section: admin
          Priority: optional
          Architecture: ${ARCH}
          Maintainer: ${GITHUB_ACTOR} <${GITHUB_ACTOR}@users.noreply.github.com>
          Depends: libprotobuf-c1, libprotobuf32, libnl-3-200, libnl-route-3-200, libcap2, libbsd0, libmnl0, libaio1, libnet1, libgnutls30
          Description: CRIU (Checkpoint/Restore In Userspace) built per official guide
           Built from ${GITHUB_REPOSITORY}@${GITHUB_SHA}
          EOF
          DEB="criu_${VER}_${ARCH}.deb"
          fakeroot dpkg-deb --build --root-owner-group pkgroot "$DEB"
          echo "DEB_FILE=$DEB" >> $GITHUB_ENV
          ls -lah "$DEB"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: criu-ubuntu-deb
          path: |
            ${{ env.DEB_FILE }}

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: criu-ubuntu-deb
          path: .

      - name: Release metadata
        id: meta
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            NAME="CRIU ${TAG} (built per official guide)"
            PRERELEASE="false"
          else
            DATE="$(date -u +'%Y%m%d-%H%M%SZ')"
            SHORT_SHA="${GITHUB_SHA::7}"
            TAG="ubuntu-nightly-${DATE}-${SHORT_SHA}"
            NAME="Ubuntu nightly ${DATE} (${SHORT_SHA}) — official guide build"
            PRERELEASE="true"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "name=${NAME}" >> $GITHUB_OUTPUT
          echo "prerelease=${PRERELEASE}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          make_latest: true
          generate_release_notes: true
          files: |
            *.deb
