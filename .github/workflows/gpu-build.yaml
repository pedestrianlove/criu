name: Build CRIU .deb (Debian packaging) + Release

on:
  push:
    branches: [ main, master, criu-dev ]
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      PKGNAME: criu
    steps:
      - name: Checkout (your fork)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Enable deb-src & install base packaging tools
        run: |
          sudo sed -i 's/^# deb-src/deb-src/' /etc/apt/sources.list
          sudo apt-get update
          sudo apt-get install -y devscripts equivs git ca-certificates \
                                  build-essential fakeroot dpkg-dev

      - name: Fetch Debian packaging (debian/ directory)
        run: |
          git clone --depth 1 https://salsa.debian.org/debian/criu.git debian-pkg
          # Copy the official debian/ into your working tree
          rm -rf debian
          cp -a debian-pkg/debian ./debian

      - name: Read version from debian/changelog
        id: meta
        run: |
          SRC="$(dpkg-parsechangelog -S Source)"
          VER="$(dpkg-parsechangelog -S Version)"
          echo "source=${SRC}" >> $GITHUB_OUTPUT
          echo "version=${VER}" >> $GITHUB_OUTPUT
          # Decide release flavor (tag push = normal; branch push = prerelease)
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "prerelease=false" >> $GITHUB_OUTPUT
            echo "relname=${SRC} ${VER}" >> $GITHUB_OUTPUT
          else
            echo "prerelease=true" >> $GITHUB_OUTPUT
            echo "relname=${SRC} ${VER} (CI build)" >> $GITHUB_OUTPUT
          fi

      - name: Install build-deps from debian/control
        run: |
          sudo mk-build-deps -i -t "apt-get -y" -r debian/control

      - name: Build .deb packages (dpkg-buildpackage)
        run: |
          dpkg-buildpackage -b -us -uc
          ls -lah ../*.deb ../*.buildinfo ../*.changes || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: criu-debs
          path: |
            ../*.deb
            ../*.buildinfo
            ../*.changes

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: criu-debs
          path: .

      - name: Decide release metadata
        id: meta
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            NAME="CRIU ${TAG}"
            PRERELEASE="false"
          else
            DATE="$(date -u +'%Y%m%d-%H%M%SZ')"
            SHORT_SHA="${GITHUB_SHA::7}"
            TAG="nightly-${DATE}-${SHORT_SHA}"
            NAME="Nightly build ${DATE} (${SHORT_SHA})"
            PRERELEASE="true"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "name=${NAME}" >> $GITHUB_OUTPUT
          echo "prerelease=${PRERELEASE}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          generate_release_notes: true
          files: |
            *.deb
            *.buildinfo
            *.changes
