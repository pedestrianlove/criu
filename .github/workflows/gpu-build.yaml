name: Build CRIU .deb (Debian packaging) + Release

on:
  push:
    branches: [ main, master, criu-dev ]
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      PKGNAME: criu
    steps:
      - name: Checkout (your fork)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Enable deb-src & install base packaging tools
        run: |
          sudo sed -i 's/^# deb-src/deb-src/' /etc/apt/sources.list
          sudo apt-get update
          sudo apt-get install -y devscripts equivs git ca-certificates \
                                  build-essential fakeroot dpkg-dev

      - name: Fetch Debian packaging (debian/ directory)
        run: |
          git clone --depth 1 https://salsa.debian.org/debian/criu.git debian-pkg
          # Copy the official debian/ into your working tree
          rm -rf debian
          cp -a debian-pkg/debian ./debian

      - name: Compute version metadata
        id: ver
        run: |
          DATE="$(date -u +'%Y%m%d%H%M')"
          DESC="$(git describe --tags --always --dirty || true)"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG#v}"
            PRERELEASE="false"
            NAME="CRIU ${TAG}"
          else
            VERSION="0.0~git${DATE}-${DESC}"
            PRERELEASE="true"
            NAME="Nightly build ${DATE}"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "name=${NAME}" >> $GITHUB_OUTPUT
          echo "prerelease=${PRERELEASE}" >> $GITHUB_OUTPUT

      - name: Update debian/changelog for CI build
        run: |
          export DEBFULLNAME="${{ github.actor }}"
          export DEBEMAIL="${{ github.actor }}@users.noreply.github.com"
          # Create/refresh a CI changelog entry (keeps dpkg-buildpackage happy)
          dch --create --package "$PKGNAME" --newversion "${{ steps.ver.outputs.version }}" \
              --empty "CI build from $GITHUB_REPOSITORY@$GITHUB_SHA"
          head -n 5 debian/changelog

      - name: Install build-deps from debian/control
        run: |
          sudo mk-build-deps -i -t "apt-get -y" -r debian/control

      - name: Build .deb packages (dpkg-buildpackage)
        run: |
          dpkg-buildpackage -b -us -uc
          ls -lah ../*.deb ../*.buildinfo ../*.changes || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: criu-debs
          path: |
            ../*.deb
            ../*.buildinfo
            ../*.changes

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: criu-debs
          path: .

      - name: Decide release metadata
        id: meta
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            NAME="CRIU ${TAG}"
            PRERELEASE="false"
          else
            DATE="$(date -u +'%Y%m%d-%H%M%SZ')"
            SHORT_SHA="${GITHUB_SHA::7}"
            TAG="nightly-${DATE}-${SHORT_SHA}"
            NAME="Nightly build ${DATE} (${SHORT_SHA})"
            PRERELEASE="true"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "name=${NAME}" >> $GITHUB_OUTPUT
          echo "prerelease=${PRERELEASE}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          generate_release_notes: true
          files: |
            *.deb
            *.buildinfo
            *.changes
